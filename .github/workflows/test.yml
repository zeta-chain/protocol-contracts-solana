name: test

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Setup Solana
        uses: heyAyushh/setup-solana@v5.9
        with:
          solana-cli-version: "2.1.0"

      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked --force

      - name: Display Versions
        run: |
          solana -V
          solana-keygen new --no-bip39-passphrase --force
          rustc -V
          anchor -V

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: ./node_modules/
          key: node-modules-${{ runner.os }}-build-22.14.0

      - name: Install dependencies
        run: yarn
        shell: bash

      - name: Run Anchor tests
        run: anchor test
        shell: bash